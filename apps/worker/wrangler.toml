name = "bezoar"
main = "src/index.js"
compatibility_date = "2026-11-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "../site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/mcp", "/llms.txt", "/feed.xml", "/feed.json", "/scan/*"]

[ai]
binding = "AI"

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bezoar-db"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
SITE_URL = "https://getbezoar.com"
SCAN_PER_10MIN = "30"
REVIEW_PER_10MIN = "20"
REGISTRY_ADDRESS = ""
FEE_BURNER = "0x4e83596410b2d40802A4dF6014a6d46633A7c07e"
TOKEN_ADDRESS = "0xe300307C27091690Ce8995b60eA18640344D9adF"
